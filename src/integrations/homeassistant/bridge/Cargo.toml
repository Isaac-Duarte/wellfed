[package]
license.workspace = true
name = "wellfed-homeassistant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Home Assistant's Rust half: a client key, invite pairing and one feeder's device API session through wellfed-connect, exposed to Python through PyO3"
publish.workspace = true

[lib]
# The Python module's name; maturin builds the cdylib with `--features python`.
name = "wellfed_homeassistant"
crate-type = ["cdylib", "lib"]

[features]
# The PyO3 module. Off for the workspace's checks, so `make check` needs no
# Python; `make check-homeassistant` builds and lints it.
python = ["dep:pyo3"]

[dependencies]
jiff.workspace = true
pyo3 = { version = "=0.30.1", features = ["abi3-py313", "experimental-inspect"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats.workspace = true
wellfed-model.workspace = true
wellfed-session.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wellfed-feeder-sim = { workspace = true, features = ["harness"] }

[lints]
workspace = true
