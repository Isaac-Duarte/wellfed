[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "wellfed-homeassistant"
# The bridge crate's version, one source for the wheel and the integration.
dynamic = ["version"]
description = "Wellfed's device API client for Home Assistant, built from the Rust workspace"
requires-python = ">=3.13"
license = "MIT"

[tool.maturin]
features = ["python"]
module-name = "wellfed_homeassistant"
