# The integration's types, against Home Assistant's and the bridge's stub
# (`make check-homeassistant`).
[mypy]
python_version = 3.14
strict = True
warn_unreachable = True
files = custom_components, tests

# Home Assistant re-exports through package roots without `__all__`, as
# its own integrations import them.
[mypy-homeassistant.*]
implicit_reexport = True

# The test harness ships no type marker.
[mypy-pytest_homeassistant_custom_component.*]
ignore_missing_imports = True
