[package]
license.workspace = true
name = "wellfed-stock-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The bench's server for stock PLAF103 1.1.15 (the `wellfed-stock` binary), over the wellfed-stock library"
publish.workspace = true

[[bin]]
name = "wellfed-stock"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono-tz = "0.10.4"
clap.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
wellfed-client.workspace = true
wellfed-formats = { workspace = true, features = ["clap"] }
wellfed-stock.workspace = true

[dev-dependencies]
chrono = "0.4.45"
rumqttc = { version = "0.25.1", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
