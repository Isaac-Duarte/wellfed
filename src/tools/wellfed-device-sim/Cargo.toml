[package]
license.workspace = true
name = "wellfed-device-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What every simulated Wellfed device shares: its storage image, the stores every device keeps, its sockets and setup link, and its banks and update stage"
publish.workspace = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
wellfed-amebad-sys.workspace = true
wellfed-board.workspace = true
wellfed-core.workspace = true
wellfed-device.workspace = true
wellfed-device-api.workspace = true
wellfed-hal.workspace = true
wellfed-proto.workspace = true

[features]
# The test harness other crates' tests start simulators with; never built
# into a binary.
harness = []

[lints]
workspace = true
