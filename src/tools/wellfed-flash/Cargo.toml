[package]
license.workspace = true
name = "wellfed-flash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "UART flash reads, region-scoped updates and stock recovery for the PLAF103 and PLWF106 research units"
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap.workspace = true
ctrlc.workspace = true
wellfed-core.workspace = true
wellfed-formats = { workspace = true, features = ["clap"] }
wellfed-image.workspace = true
wellfed-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
wellfed-emu.workspace = true
wellfed-image = { workspace = true, features = ["fixtures"] }
tempfile.workspace = true

[lints]
workspace = true
