[package]
license.workspace = true
name = "wellfed-emu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Offline ARM execution of the vendor factory loader and UART flash helper under unicorn"
publish.workspace = true

[dependencies]
wellfed-formats.workspace = true
thiserror.workspace = true
# Builds the unicorn C library with cmake. Only the 32-bit ARM backend: the
# others go unused, and the 64-bit ones need 16-byte atomics from libatomic that
# GCC on aarch64 hosts leaves unresolved.
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_arm"] }

[dev-dependencies]
wellfed-core.workspace = true
wellfed-hal-common.workspace = true

[lints]
workspace = true
