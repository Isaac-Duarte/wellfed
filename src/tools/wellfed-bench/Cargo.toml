[package]
license.workspace = true
name = "wellfed-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Relay bench for the PLAF103 research unit: the bench server in the foreground and the command line that is its client"
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The operator's timers: local clock times and lengths such as `5m`.
jiff = "0.2.38"
# `serve`'s full-screen console on /dev/tty, and its keys.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29.0"
# `wellfed-bench mcp`: the bench's tools for an agent, over stdio.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
# The MCP tools' argument schemas, as rmcp's own are made.
schemars = "1.2.3"
serde.workspace = true
serde_json.workspace = true
wellfed-bench-server = { path = "../wellfed-bench-server" }
wellfed-formats.workspace = true
wellfed-relay = { path = "../wellfed-relay" }
wellfed-rig = { path = "../wellfed-rig" }
rustix = { version = "1", features = ["fs", "process"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile.workspace = true
# The MCP test runs a real server on a scripted relay board.
wellfed-relay = { path = "../wellfed-relay", features = ["fake"] }

[lints]
workspace = true
