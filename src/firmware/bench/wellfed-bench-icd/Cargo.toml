[package]
license.workspace = true
name = "wellfed-bench-icd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Wellfed Bench control interface: postcard-rpc endpoints, relay state, telemetry scaling and the RECOVER press classifier"
publish.workspace = true

# Not workspace dependencies: the RP2040 firmware builds this crate too, so
# serde must stay without its std feature.
[dependencies]
postcard-rpc = { version = "0.12.1", default-features = false }
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }

[lints]
workspace = true
