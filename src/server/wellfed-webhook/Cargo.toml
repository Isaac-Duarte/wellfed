[package]
license.workspace = true
name = "wellfed-webhook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The server's alert webhook: a small, stable JSON body POSTed to an owner's URL when an alert opens or clears, at most once per change, with bounded retries"
publish.workspace = true

[dependencies]
jiff.workspace = true
# rustls with its own provider, as every reqwest client in the workspace:
# a feature without one would make each of them panic on build.
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
wellfed-api.workspace = true
wellfed-client.workspace = true
wellfed-formats.workspace = true
wellfed-mirror.workspace = true
wellfed-model.workspace = true
wellfed-store.workspace = true

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
