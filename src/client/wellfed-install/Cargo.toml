[package]
license.workspace = true
name = "wellfed-install"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The install from stock 1.1.15 to Wellfed, driven over tokio: stock's server in-process, pairing, the backup and the promotion, with prompts, Bluetooth, discovery and progress from the platform"
publish.workspace = true

[dependencies]
chrono-tz = "0.10.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats.workspace = true
wellfed-model.workspace = true
wellfed-proto.workspace = true
wellfed-session.workspace = true
wellfed-signing.workspace = true
# Stock's broker, server and image server, run in this process; without
# the bench host's neighbour lookup and its binary. A captured device, which
# records no address, is refused.
wellfed-stock = { workspace = true, default-features = false }

[features]
# A restore of a stock image no pin names, for tests and simulators, which
# cannot hold the vendor's image.
fixtures = ["wellfed-signing/fixtures"]

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rumqttc = { version = "0.25.1", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wellfed-core.workspace = true
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
wellfed-signing = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
