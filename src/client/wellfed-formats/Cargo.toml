[package]
license.workspace = true
name = "wellfed-formats"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "File formats the host tools share: canonical JSON, build manifests and identities, the stock layout, locks, captures, credentials and keys and the private-file writer"
publish.workspace = true

[dependencies]
clap = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# The OS CSPRNG for new secrets; `std` makes its error a `std::error::Error`.
getrandom = { workspace = true, features = ["std"] }
wellfed-session.workspace = true
wellfed-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }

# Linux and Android rename without replacing; every Unix asks a key
# file's filesystem whether it keeps modes at all.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[features]
# The device model and the provisioning as command-line options (`--device`,
# `--provisioning`).
clap = ["dep:clap"]
# The server's export archive: only the server links it.
export = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
