[package]
license.workspace = true
name = "wellfed-board"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The board a firmware is built for, chosen by feature: the one crate the SDK and the product read pins, polarities and the storage map from"
publish.workspace = true

[features]
default = ["plaf103"]
# The PLAF103 feeder's board. A second board is a second feature and crate;
# exactly one may be on.
plaf103 = ["dep:wellfed-board-plaf103"]

[dependencies]
wellfed-board-plaf103 = { workspace = true, optional = true }

[lints]
workspace = true
