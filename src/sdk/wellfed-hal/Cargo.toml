[package]
license.workspace = true
name = "wellfed-hal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental AmebaD KM4 chip HAL: supervision, flash leases, transport, updater and the generic panel drivers, on the board contract"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["wellfed-amebad-sys/sdk"]
# KM4 target builds; the KM0 image links only wellfed-hal-common.
km4 = ["wellfed-hal-common/km4", "wellfed-amebad-sys/km4"]
# BLE setup; needs a Bluetooth firmware's image.
bluetooth = ["wellfed-amebad-sys/bluetooth"]
# Button presses typed on the log UART (`wellfed_core::virtual_panel`),
# for a bench with nobody at it. Only the feeder's `virtual-panel` bench
# variant sets it.
virtual-panel = []
# The RAM log tail beside the UART log.
log-tail = ["wellfed-amebad-sys/log-tail"]

[dependencies]
wellfed-hal-common.workspace = true
wellfed-amebad-sys.workspace = true
wellfed-board.workspace = true
wellfed-core.workspace = true
wellfed-signed.workspace = true
wellfed-session.workspace = true
# Bank 0's image is hashed before a give-way; the rounds are core's.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-dalek = "2"
sha2 = "0.10"

[lints]
workspace = true
