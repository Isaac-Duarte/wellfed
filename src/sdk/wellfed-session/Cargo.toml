[package]
license.workspace = true
name = "wellfed-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The device API's session layer: Noise handshakes, HMAC, the setup code, length-prefixed frames, and the hex and base64 text forms"
publish.workspace = true

[dev-dependencies]
proptest.workspace = true
snow = "0.10"

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }

[lints]
workspace = true
