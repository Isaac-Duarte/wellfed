[package]
license.workspace = true
name = "wellfed-signed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The frozen signed update formats bank 0 checks: manifest, key statements, key ids and the image bounds"
publish.workspace = true

[dev-dependencies]
ed25519-dalek = "2"
proptest.workspace = true
sha2 = "0.10"
wellfed-session.workspace = true

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }

# On the feeder, the compact SHA-2 rounds: the unrolled SHA-512 alone was
# 21.8 KB of a firmware image, for a hash that only checks update
# signatures. Host builds keep the unrolled rounds.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }

[lints]
workspace = true
