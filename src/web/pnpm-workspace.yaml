packages:
  - packages/*
  - apps/*

# Dependency policy (docs/development/typescript.md#dependencies).
# A release must be a week old before it can be installed, so a compromised
# version is usually yanked before it reaches the lockfile.
minimumReleaseAge: 10080
# An exception goes under minimumReleaseAgeExclude as name@version, never a
# bare name or a pattern, with when it can be dropped; check-repository
# refuses any other.
# Added packages are pinned exactly; the lockfile is frozen in every check.
savePrefix: ""
# No dependency runs an install script unless it is listed here.
strictDepBuilds: true
allowBuilds: {}
