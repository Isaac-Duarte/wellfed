[package]
license.workspace = true
name = "wellfed-app-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The app's Rust half over flutter_rust_bridge: the client key, BLE setup and LAN recovery, LAN discovery and the Bluetooth radio on the desktops, device API sessions through wellfed-connect, and the install"
publish.workspace = true

[lib]
# cdylib for Android and Linux, staticlib for macOS (linked into the runner by
# its pod); lib for the crate's own tests.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
futures-util.workspace = true
jiff.workspace = true
log = "0.4.34"
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["serde", "v4"] }
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats.workspace = true
wellfed-install.workspace = true
wellfed-model.workspace = true
wellfed-session.workspace = true

[dev-dependencies]
# Stock's own times and its MQTT broker, in the install and restore tests.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
proptest.workspace = true
rumqttc = { version = "0.25.1", default-features = false }
tempfile.workspace = true
uuid.workspace = true
wellfed-signed.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
wellfed-install = { workspace = true, features = ["fixtures"] }
wellfed-signing.workspace = true

[lints]
workspace = true

# The desktops' Bluetooth (`api::bluetooth`); Android's is Dart's.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
wellfed-ble.workspace = true

# The JNI hook Kotlin calls (`android.rs`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
