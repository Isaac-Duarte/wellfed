[package]
license.workspace = true
name = "wellfed-app-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Android app's Rust half over flutter_rust_bridge: the client key, BLE setup and LAN recovery, device API sessions through wellfed-connect, and the owner's server through wellfed-server-client"
publish.workspace = true

[lib]
# cdylib for Android; lib for the crate's own tests.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
jiff.workspace = true
log = "0.4.34"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
wellfed-api.workspace = true
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats.workspace = true
wellfed-install.workspace = true
wellfed-model.workspace = true
wellfed-server-client.workspace = true
wellfed-session.workspace = true

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rumqttc = { version = "0.25.1", default-features = false }
tempfile.workspace = true
uuid.workspace = true
wellfed-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
wellfed-install = { workspace = true, features = ["fixtures"] }
wellfed-signing.workspace = true
wellfed-server-testkit.workspace = true

[lints]
workspace = true

