# The runner run_build_tool writes is the root package, so pub reads only
# its pins, never build_tool/pubspec.lock: without these, each clean build
# would resolve build_tool's transitive packages afresh. They hold every
# package that lock resolved to its locked version, and the bridge's tests
# check the two agree. Regenerate these when the lock changes.
