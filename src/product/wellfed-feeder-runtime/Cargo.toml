[package]
license.workspace = true
name = "wellfed-feeder-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The feeder's record stores on the Wellfed SDK runtime: its stores in the shared settings writer, the writer's settings stage, and their mailboxes with the loop, which every PLAF103 firmware links"
publish.workspace = true

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4", "wellfed-hal/km4", "wellfed-hal/sdk", "wellfed-device-runtime/km4"]

[dependencies]
wellfed-core.workspace = true
wellfed-device.workspace = true
wellfed-device-api.workspace = true
wellfed-device-runtime.workspace = true
wellfed-feeder.workspace = true
wellfed-hal.workspace = true
wellfed-proto.workspace = true
wellfed-sdk.workspace = true

[dev-dependencies]
wellfed-signed.workspace = true

[lints]
workspace = true
