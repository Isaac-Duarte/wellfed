# cargo-nextest, the test runner `make check-rust` uses. Each test runs in its
# own process, so a test that hangs on a loopback socket or the simulator
# worker is named and killed instead of stalling the whole suite.

[profile.default]
# Reported after 60 s and killed after 180 s. Every host test is synthetic and
# finishes in seconds; one that needs longer says why in a per-test override.
slow-timeout = { period = "60s", terminate-after = 3 }
# Report every failure in one run rather than stopping at the first.
fail-fast = false

# The app's install runs bind the stock broker's fixed port, and the Reset route
# binds it on every address, which no other address on that port can share.
# This orders one run; a lock in those tests orders runs from other checkouts.
[test-groups]
app-install-broker = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(wellfed-app-bridge) & binary(install)'
test-group = 'app-install-broker'

# The longest tests start first. Each waits out a real timeout or the
# simulator's 20 ms pace, so it takes as long on any machine; started last,
# one would run on alone after the rest of the suite had finished (the suite
# took 27.5 s rather than 22 s). Add a test here when it takes more than
# about 8 s.
[[profile.default.overrides]]
filter = '''
    (package(wellfed-server) & test(=bank_1_read_from_bank_0_is_kept_exported_and_restored_after_promotion))
    | (package(wellfed-server) & test(=samples_read_raw_in_pages_and_by_the_hour))
    | (package(wellfed-homeassistant) & test(/^(a_feed_whose_answer_is_lost_is_uncertain_sent_once_and_then_settled|a_revoked_key_stops_the_session_for_good|a_feed_that_never_reached_the_feeder_is_still_unknown_after_the_backlog)$/))
    | (package(wellfed-bench) & test(/an_enrollment_answered_by_a_late_press_comes_back_through_the_server|a_watcher_nobody_reads_stops_fetching/))
    | (package(wellfed-mirror) & test(=the_tasks_own_request_unanswered_in_time_keeps_the_session))
    | (package(wellfed-app-bridge) & test(/^(another_feeder_is_served_after_the_owner_said_no_to_the_first|an_adoption_whose_answer_is_lost_is_settled_by_reading_and_never_invited_twice)$/))
    | (package(wellfed-flash) & test(/each_wrong_answer_is_its_own_refusal_and_is_never_resent/))
    | (package(wellfed-rig) & test(/a_clean_push_and_a_dropped_one_both_activate/))
    | (package(wellfed-install) & test(/stock_coming_back_says_it_stayed_and_hears_no_install/))
'''
priority = 100
