# cargo-nextest, the test runner `make check-rust` uses. Each test runs in its
# own process, so a test that hangs on a loopback socket or the simulator
# worker is named and killed instead of stalling the whole suite.

[profile.default]
# Reported after 60 s and killed after 180 s. Every host test is synthetic and
# finishes in seconds; one that needs longer says why in a per-test override.
slow-timeout = { period = "60s", terminate-after = 3 }
# Report every failure in one run rather than stopping at the first.
fail-fast = false

# The app's install runs bind the stock broker's fixed port, and the Reset route
# binds it on every address, which no other address on that port can share.
# This orders one run; a lock in those tests orders runs from other checkouts.
[test-groups]
app-install-broker = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(wellfed-app-bridge) & binary(install)'
test-group = 'app-install-broker'

# The longest tests start first. Each waits out the simulator's pace or a
# real window, so it takes as long on any machine; started last, one would
# run on alone after the rest of the suite had finished (the suite took
# 27.5 s rather than 22 s). Add a test here when it takes more than about
# 8 s:
# - the stock read and restore moves a whole bank a page at a time, each
#   page a pass of the simulator, which paces itself as the firmware does;
# - an update key's enrollment is held past the session's real 10 s answer
#   window, the window the test is about;
# - two power samples come 5 s apart, as the simulator samples its supply;
# - the settings model walks every sequence to depth 6, about 30 s unoptimized.
[[profile.default.overrides]]
filter = '''
    (package(wellfed-device) & test(=no_generation_names_two_settings))
    | (package(wellfed-server) & test(=bank_1_read_from_bank_0_is_kept_exported_and_restored_after_promotion))
    | (package(wellfed-server) & test(=samples_read_raw_in_pages_and_by_the_hour))
    | (package(wellfed-bench) & test(/an_enrollment_answered_by_a_late_press_comes_back_through_the_server/))
'''
priority = 100
