# The Home Assistant integration: its checks on every push, and on a
# `homeassistant-v<version>` tag its release: the bridge's wheels to PyPI by
# trusted publishing, and the integration to its HACS mirror repository.
#
# The owner creates the PyPI project (with this workflow and the `pypi`
# environment as its trusted publisher) and the mirror repository (with
# HOMEASSISTANT_MIRROR_KEY as a deploy key that may write, and
# HOMEASSISTANT_MIRROR_TOKEN allowed to make its releases), then pushes the
# first tag. Every action is pinned by commit.
name: Home Assistant
on:
  push:
    branches: [master]
    tags: ["homeassistant-v*"]
  pull_request:
permissions:
  contents: read
env:
  BRIDGE: src/integrations/homeassistant/bridge/Cargo.toml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install the check tools
        run: cargo install --locked cargo-nextest@0.9.132 cargo-deny@0.19.2
      - name: Contributor checks
        run: make check
      - name: Home Assistant checks
        run: make check-homeassistant

  wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { target: armv7-unknown-linux-musleabihf, manylinux: musllinux_1_2 }
          - { target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked -m ${{ env.BRIDGE }} --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m ${{ env.BRIDGE }} --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/homeassistant-v')
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the bridge's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path "$BRIDGE" \
            | jq -r '.packages[] | select(.name == "wellfed-homeassistant") | .version')
          test "homeassistant-v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, crate version $version"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mirror:
    if: startsWith(github.ref, 'refs/tags/homeassistant-v')
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      MIRROR: Isaac-Duarte/wellfed-homeassistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push the integration to the mirror and tag it
        env:
          KEY: ${{ secrets.HOMEASSISTANT_MIRROR_KEY }}
        run: |
          version=${GITHUB_REF_NAME#homeassistant-v}
          install -m 600 /dev/null ~/mirror_key && printf '%s\n' "$KEY" > ~/mirror_key
          export GIT_SSH_COMMAND="ssh -i ~/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:$MIRROR.git" mirror
          rm -rf mirror/custom_components
          mkdir -p mirror/custom_components
          cp -R src/integrations/homeassistant/custom_components/wellfed mirror/custom_components/
          cp docs/guide/home-assistant.md mirror/README.md
          printf '{\n  "name": "Wellfed",\n  "homeassistant": "2026.10.0",\n  "render_readme": true\n}\n' > mirror/hacs.json
          cd mirror
          git config user.name "Wellfed release"
          git config user.email "release@users.noreply.github.com"
          git add -A
          git commit -m "Wellfed $version" || echo "nothing changed"
          git tag "v$version"
          git push origin HEAD "v$version"
      - name: Release the tag, which HACS installs from
        env:
          GH_TOKEN: ${{ secrets.HOMEASSISTANT_MIRROR_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#homeassistant-v}
          gh release create "v$version" --repo "$MIRROR" --title "Wellfed $version" \
            --notes "Built from $GITHUB_REPOSITORY at $GITHUB_SHA."
