[workspace]
members = [
    "src/sdk/*",
    "src/product/*",
    "src/client/*",
    "src/sim/*",
    "src/tools/wellfed",
    "src/tools/wellfed-*",
    "src/tools/xtask",
    "src/firmware/wellfed/*",
    "src/firmware/bench/wellfed-bench-at",
    "src/app/rust",
    "src/integrations/homeassistant/bridge",
]
# The cargo-fuzz targets build on nightly-only sanitizer flags, so they keep
# their own workspace and lockfile (`cargo xtask fuzz`). The bench board's
# RP2040 firmware builds only for its target (`make check-bench-board`).
exclude = ["src/fuzz", "src/firmware/bench/wellfed-bench-board"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
wellfed-hal = { path = "src/sdk/wellfed-hal" }
wellfed-hal-feeder = { path = "src/sdk/wellfed-hal-feeder" }
wellfed-fw-feeder = { path = "src/firmware/wellfed/feeder" }
wellfed-hal-common = { path = "src/sdk/wellfed-hal-common" }
wellfed-amebad-sys = { path = "src/sdk/wellfed-amebad-sys" }
wellfed-board = { path = "src/sdk/wellfed-board" }
wellfed-board-plaf103 = { path = "src/sdk/wellfed-board-plaf103" }
wellfed-board-plwf106 = { path = "src/sdk/wellfed-board-plwf106" }
wellfed-core = { path = "src/sdk/wellfed-core" }
wellfed-core-feeder = { path = "src/sdk/wellfed-core-feeder" }
wellfed-proto = { path = "src/product/wellfed-proto" }
wellfed-session = { path = "src/sdk/wellfed-session" }
wellfed-signed = { path = "src/sdk/wellfed-signed" }
wellfed-probes = { path = "src/sdk/wellfed-probes" }
wellfed-sdk = { path = "src/sdk/wellfed-sdk" }
wellfed-sdk-macros = { path = "src/sdk/wellfed-sdk-macros" }
wellfed-device = { path = "src/product/wellfed-device" }
wellfed-device-api = { path = "src/product/wellfed-device-api" }
wellfed-device-runtime = { path = "src/product/wellfed-device-runtime" }
wellfed-feeder = { path = "src/product/wellfed-feeder" }
wellfed-feeder-runtime = { path = "src/product/wellfed-feeder-runtime" }
wellfed-client = { path = "src/client/wellfed-client" }
wellfed-model = { path = "src/client/wellfed-model" }
wellfed-connect = { path = "src/client/wellfed-connect" }
wellfed-install = { path = "src/client/wellfed-install" }
wellfed-device-sim = { path = "src/sim/wellfed-device-sim" }
wellfed-feeder-sim = { path = "src/sim/wellfed-feeder-sim" }
wellfed-formats = { path = "src/client/wellfed-formats" }
wellfed-stock = { path = "src/client/wellfed-stock" }
wellfed-emu = { path = "src/tools/wellfed-emu" }
wellfed-image = { path = "src/client/wellfed-image" }
wellfed-signing = { path = "src/client/wellfed-signing" }
wellfed-testkit = { path = "src/sdk/wellfed-testkit" }
wellfed-sim = { path = "src/sim/wellfed-sim" }
# Host tools.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
# Bounded property tests of the network parsers (dev-dependency only). No
# fork or timeout features: properties run in-process under nextest.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = "1.28.0"
# Shared host dependencies, pinned once so crates cannot drift apart on one.
futures-util = "0.3.34"
getrandom = "0.3.4"
http-body-util = "0.1.5"
jiff = "0.2.38"
# Feeder discovery (wellfed-connect).
mdns-sd = "0.21.6"
# Firmware targets.
cortex-m = "0.7.7"

# Every crate inherits these, tests included. Host crates also forbid
# `unsafe` at their crate roots; firmware crates permit audited `unsafe` at
# the C ABI and MMIO boundaries only, each block with a SAFETY comment. The
# production-only lints (no unwrap, no narrowing `as`, …) run from
# `make check-rust` over libraries and binaries, so tests stay free to unwrap.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

# Host builds and tests optimize their dependencies a little. The simulator
# tests step the feeder tens of thousands of times through hashing, Noise and
# serialization in other crates, and unoptimized that code made the slowest
# tests six times slower. Dependencies rebuild only when the lockfile
# changes, so this costs a cold build, not an edit; the workspace's own
# crates stay unoptimized and quick to rebuild.
[profile.dev.package."*"]
opt-level = 1

# Firmware staticlibs: size-optimized, one LTO object per core so the linker
# script can retain the RAM park section; unwinding is never generated.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
