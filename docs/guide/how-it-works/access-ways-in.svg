<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="access-ways-in-title access-ways-in-desc">
  <title id="access-ways-in-title">The four ways onto the feeder's list</title>
  <desc id="access-ways-in-desc">Four paths lead to the feeder's list of up to 8 keys. Bluetooth setup, with a code keyed in on the buttons, adds an owner. An invite from a paired client, within 10 minutes and once, adds the role invited. The recovery hold on an unlocked panel, then a code, adds an owner. An owner's request, then a Dispense press within 60 seconds, adds an update key, which signs firmware and never opens a session.</desc>
  <defs>
    <marker id="access-ways-in-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head-accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="d-accent" x="540" y="30" width="156" height="310" rx="10"/>
  <text x="618" y="170" text-anchor="middle" class="d-title">The feeder's list</text>
  <text x="618" y="190" text-anchor="middle" class="d-muted">up to 8 keys</text>

  <rect class="d-box" x="24" y="24" width="390" height="70" rx="8"/>
  <text x="40" y="52" class="d-title">Bluetooth setup</text>
  <text x="40" y="72" class="d-muted">Six presses keyed in on the buttons within 60 s</text>
  <line class="d-wire-accent" x1="414" y1="59" x2="536" y2="59" marker-end="url(#access-ways-in-arrow)"/>
  <text x="475" y="50" text-anchor="middle" class="d-muted">owner</text>

  <rect class="d-box" x="24" y="110" width="390" height="70" rx="8"/>
  <text x="40" y="138" class="d-title">An invite</text>
  <text x="40" y="158" class="d-muted">From a paired client, on your network, within 10 minutes, once</text>
  <line class="d-wire-accent" x1="414" y1="145" x2="536" y2="145" marker-end="url(#access-ways-in-arrow)"/>
  <text x="475" y="136" text-anchor="middle" class="d-muted">as invited</text>

  <rect class="d-box" x="24" y="196" width="390" height="70" rx="8"/>
  <text x="40" y="224" class="d-title">The recovery hold</text>
  <text x="40" y="244" class="d-muted">Lock, then Dispense, on an unlocked panel, then a code</text>
  <line class="d-wire-accent" x1="414" y1="231" x2="536" y2="231" marker-end="url(#access-ways-in-arrow)"/>
  <text x="475" y="222" text-anchor="middle" class="d-muted">owner</text>

  <rect class="d-panel" x="24" y="282" width="390" height="70" rx="8"/>
  <text x="40" y="310" class="d-title">An update key</text>
  <text x="40" y="330" class="d-muted">An owner asks, then a Dispense press within 60 s</text>
  <line class="d-wire-accent" x1="414" y1="317" x2="536" y2="317" marker-end="url(#access-ways-in-arrow)"/>
  <text x="475" y="308" text-anchor="middle" class="d-muted">signs only</text>
</svg>
